<div class="row mb-3">
  <div class="col">
    <h2>Lista de Personas</h2>
  </div>
  <div class="col text-end">
    <a routerLink="/personas/nueva" class="btn btn-primary">Agregar Persona</a>
  </div>
</div>

<table class="table table-striped table-hover mt-3">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Edad</th>
      <th>Correo</th>
      <th>Canal Preferido</th> <!-- Se agregó la cabecera -->
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of personas">
      <td>{{ p.Id }}</td>
      <td>{{ p.Nombre }}</td>
      <td>{{ p.Apellido }}</td>
      <td>{{ p.Edad }}</td>
      <td>{{ p.Correo }}</td>
      <!-- Se muestra el canal, o se muestra "no existe canal" si viene vacío de la base de datos -->
      <td>
        <span *ngIf="p.CanalNombre">{{ p.CanalNombre }}</span>
        <span *ngIf="!p.CanalNombre" class="text-danger fst-italic">no existe canal</span>
      </td>
      <td>
        <a [routerLink]="['/personas/editar', p.Id]" class="btn btn-sm btn-warning me-2">Editar</a>
        <button (click)="deletePersona(p.Id)" class="btn btn-sm btn-danger">Eliminar</button>
      </td>
    </tr>
    <!-- Colspan cambiado a 7 por la nueva columna -->
    <tr *ngIf="personas.length === 0">
      <td colspan="7" class="text-center">No hay personas registradas.</td>
    </tr>
  </tbody>
</table>
